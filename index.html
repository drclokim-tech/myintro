<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김원기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --bg-start: #F8FAFC;
    --bg-end: #E0F2FE;
    --accent: #0EA5E9;
    --text: #1E293B;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(14, 165, 233, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 28px 48px rgba(14, 165, 233, 0.22);
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  .intro {
    font-size: 15px;
    color: #475569;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    list-style: none;
    padding: 0;
  }

  .tags li {
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(14, 165, 233, 0.1);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tags li:hover {
    background: var(--accent);
    color: #fff;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--text);
    color: #fff;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .links a:hover {
    background: var(--accent);
    transform: translateY(-2px);
  }

  .links svg {
    width: 17px;
    height: 17px;
    fill: currentColor;
  }

  @media (max-width: 480px) {
    .card {
      padding: 36px 20px;
      border-radius: 20px;
    }

    .name {
      font-size: 20px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">김</div>
    <h1 class="name">김원기</h1>
    <p class="intro">바이브코드 바이브</p>
    <ul class="tags">
      <li>독서</li>
      <li>여행</li>
      <li>사진</li>
      <li>커피</li>
    </ul>
